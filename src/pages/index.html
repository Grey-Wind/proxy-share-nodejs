<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proxy Share</title>
</head>

<body>
  <div id="title-bar">
    <img src="../../image/icon.png" width="auto" height="auto">
    <a id="title">Proxy Share</a>
  </div>
  <div id="container">
    <p>Run HTTP server&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <button type="button" id="httpServerBtn" class="runBtn">Run</button>
      <label class="state stopped">stopped</label>
    </p>
    <p>Run HTTPS server&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
      <button type="button" id="httpsServerBtn" class="runBtn">Run</button>
      <label class="state stopped">stopped</label>
    </p>

    <button type="button" id="testbtn" style="display: none;">测试launcher.js</button>
  </div>

  <link rel="stylesheet" type="text/css" href="style/base.css">
  <link rel="stylesheet" type="text/css" href="style/stateLabel.css">
  <link rel="stylesheet" type="text/css" href="style/runBtn.css">
  <script>
    document.getElementById('testbtn').addEventListener('click', () => {
      // 调用挂载到 window 对象上的方法
      window.myCustomMethod();
    });
  </script>
</body>

</html>
